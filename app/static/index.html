<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Journalismus-Check</title>
  <style>
    :root { color-scheme: light; --ink:#17201d; --muted:#63706b; --paper:#f4f1e8; --card:#fffdf7; --accent:#136f63; --line:#d8d3c6; }
    * { box-sizing:border-box } body { margin:0; font:16px/1.55 system-ui,sans-serif; color:var(--ink); background:var(--paper) }
    main { max-width:1050px; margin:auto; padding:48px 22px 80px } h1 { font:700 clamp(2.2rem,7vw,5rem)/.95 Georgia,serif; max-width:800px; margin:0 0 18px }
    .lead { max-width:760px; color:var(--muted); font-size:1.1rem } .panel { background:var(--card); border:1px solid var(--line); padding:22px; margin-top:28px; border-radius:12px; box-shadow:0 8px 24px #453d2820 }
    textarea { width:100%; min-height:310px; padding:16px; border:1px solid var(--line); border-radius:8px; background:white; font:inherit; resize:vertical }
    .actions { display:flex; gap:18px; align-items:center; margin-top:14px; flex-wrap:wrap } button { border:0; border-radius:999px; padding:12px 22px; background:var(--accent); color:white; font-weight:700; cursor:pointer }
    button:disabled { opacity:.55 } label { color:var(--muted) } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px }
    .metric { border-left:4px solid var(--accent); padding-left:12px } blockquote { margin:8px 0; padding:10px 14px; background:#f0eee6; border-radius:5px }
    .tag { display:inline-block; padding:2px 8px; border:1px solid var(--line); border-radius:99px; font-size:.8rem } li { margin:.65rem 0 } .error { color:#9b2929 } pre { white-space:pre-wrap; overflow-wrap:anywhere }
    table { width:100%; border-collapse:collapse; background:white; font-size:.9rem } th,td { padding:8px 7px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top } th { background:#efebe1; position:sticky; top:0 } .scroll-table { overflow:auto; max-height:620px }
  </style>
</head>
<body><main>
  <p class="tag">QUELLENNAHE MEDIENANALYSE</p>
  <h1>Was steht da – und was folgt wirklich daraus?</h1>
  <p class="lead">Füge einen Artikeltext ein. Der Check markiert sprachliche Signale, Akteursgewichtung und offene Prüffragen. Er bewertet Indizien, nicht Gesinnungen.</p>
  <nav class="actions"><button id="showResearch">Medienweite Stichprobe</button><button id="showAnalyzer">Eigenen Text prüfen</button></nav>
  <div id="research"></div>
  <div id="analyzer" hidden>
  <section class="panel">
    <textarea id="text" placeholder="Artikeltext hier einfügen (mindestens 80 Zeichen) …"></textarea>
    <div class="actions"><button id="run">Analysieren</button><label><input id="deep" type="checkbox"> KI-Tiefenanalyse (API-Schlüssel nötig)</label></div>
    <p id="status"></p>
  </section>
  <div id="result"></div>
  </div>
</main>
<script>
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const research=document.querySelector('#research'), analyzer=document.querySelector('#analyzer');
document.querySelector('#showAnalyzer').onclick=()=>{research.hidden=true;analyzer.hidden=false};
async function showResearch(){
  analyzer.hidden=true; research.hidden=false;
  if(research.dataset.loaded) return;
  research.innerHTML='<section class="panel"><p>Datenbank wird geladen …</p></section>';
  const d=await fetch('/api/research').then(r=>r.json()); research.dataset.loaded='1';
  const stats={full:d.articles.filter(a=>a.research_status==='vollständig geprüft').length, meta:d.articles.filter(a=>a.research_status.includes('Metadaten')||a.research_status.includes('Titel')).length, missing:d.articles.filter(a=>a.research_status==='nicht gefunden').length};
  const codedMedia=[...new Set(d.article_codings.map(c=>c.medium))].map(name=>{const cc=d.article_codings.filter(c=>c.medium===name), editorial=cc.filter(c=>!c.genre.toLowerCase().includes('agentur')), scored=editorial.length?editorial:cc, avg=scored.reduce((s,c)=>s+c.policy_score,0)/scored.length, variance=scored.reduce((s,c)=>s+(c.policy_score-avg)**2,0)/scored.length, progress=d.sample_progress.find(p=>p.medium===name);return {name,n:cc.length,editorial:editorial.length,avg,sd:Math.sqrt(variance),full:progress.editorial_fulltexts,topics:progress.topic_count,mature:progress.mature}}).sort((a,b)=>a.avg-b.avg);
  const codedTopics=[...new Set(d.article_codings.map(c=>c.topic))].map(topic=>({topic,n:d.article_codings.filter(c=>c.topic===topic).length}));
  const reachPanel=`<section class="panel" id="reichweite"><h2>Die 25 reichweitenstärksten deutschen Nachrichtenmarken – Reichweite und politische Einordnung, belegt</h2><p><b>Reichweite:</b> wöchentliche Nutzung laut Reuters Institute Digital News Report 2025 – Ergebnisse für Deutschland (Leibniz-HBI), Abbildung 15 (offline) und 16 (online). <b>Politische Einordnung zweistufig:</b> (1) <b>struktureller Beleg</b> – Eigentümer/Trägerschaft, politische Agenda und externe Einordnung; (2) <b>Korpusbefund</b> – mittlerer Politikscore aus geprüften Migrations-/Asyl-Artikeln. Nach METHODE.md gilt ein politischer Richtungsbefund erst ab 20 redaktionellen Volltexten aus 3 Themenfenstern als belastbar („reif"); darunter steht „Pilot" bzw. „Korpus im Aufbau". Skala −2 migrationsliberal · 0 neutral · +2 migrationsrestriktiv.</p><div class="scroll-table"><table><thead><tr><th>Rang</th><th>Marke</th><th>Wöchentliche Reichweite (Beleg)</th><th>Politische Einordnung – struktureller Beleg</th><th>Korpusbefund (Migrationsartikel)</th></tr></thead><tbody>${d.reach_ranking.map(r=>{const med=d.media.find(m=>m.name===r.media_name);const ms=d.media_summary.find(s=>s.medium===r.media_name);const owner=med?(med.evidence||[]).filter(e=>/eigent|träger|herausg|finanz|agenda|extern/i.test(e.art)):[];const struktur=med?`<b>${esc(med.profile)}</b>${owner.length?'<br>'+owner.map(e=>`<small><b>${esc(e.art)}:</b> ${esc(e.beleg)} <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.quelle)} ↗</a></small>`).join('<br>'):''}`:`<small>${esc(r.political_note||'—')}</small>`;const relRec=(d.reliability||[]).find(x=>x.medium===r.media_name);const relBadge=relRec?` · <span class="tag">zweitkodiert κ=${relRec.policy_weighted_kappa}</span>`:'';const korpus=((ms&&ms.editorial_fulltexts>0)?`Ø ${ms.policy_mean===null?'—':ms.policy_mean.toFixed(2)} · n=${ms.editorial_fulltexts} Volltexte · ${ms.mature?'<b>reif</b>':'Pilot'}`:'<small>Korpus im Aufbau (n=0)</small>')+relBadge;const reach=(r.reach_pct===null?'—':`<b>${r.reach_pct}%</b>`);return `<tr><td>${r.rank}</td><td><b>${esc(r.label)}</b><br><small class="tag">${esc(r.grouping)}</small></td><td>${reach}<br><small>${esc(r.reach_note)}</small><br><a href="${esc(r.reach_url)}" target="_blank" rel="noopener"><small>${esc(r.reach_source)} ↗</small></a></td><td>${struktur}</td><td>${korpus}</td></tr>`}).join('')}</tbody></table></div><p class="tag">Digital-native Parteimedien (z. B. NIUS, Apollo News, Junge Freiheit, junge Welt, nd) liegen unter der Top-25-Reichweite, sind aber im Eigentümer-Panel unten belegt.</p></section>`;
  const reliabilityPanel=(d.reliability||[]).map(rl=>`<section class="panel" id="reliabilitaet-${esc(rl.medium)}"><h2>Intercoder-Reliabilität: ${esc(rl.medium)}</h2><p>${esc(rl.label)}. Geprüft wird, ob der reife Richtungsbefund von einer einzelnen Kodierung abhängt: Zwei unabhängige Kodierungen derselben ${rl.n} redaktionellen Volltexte werden verglichen (${esc(rl.scale)}).</p><div class="grid"><p class="metric"><b>${rl.policy_exact_pct}%</b><br>exakt gleicher Politikscore</p><p class="metric"><b>${rl.policy_within1_pct}%</b><br>Übereinstimmung innerhalb ±1 Stufe</p><p class="metric"><b>κ=${rl.policy_weighted_kappa}</b><br>gewichtetes Cohen-Kappa (Politikscore)</p><p class="metric"><b>${rl.coder1_policy_mean} / ${rl.coder2_policy_mean}</b><br>Ø Kodierer 1 / Kodierer 2</p></div><p><b>Richtungsbefund robust: ${rl.direction_robust?'ja':'nein'}.</b> Beide Kodierungen ergeben unabhängig dieselbe migrationspolitische Grundtendenz der ${esc(rl.medium)}-Eigenstücke. Die exakte Stärke einzelner Artikel streut, liegt aber innerhalb einer Skalenstufe; die Grundrichtung ist stabil und nicht von einem einzelnen Kodierer abhängig.</p><details><summary>Übereinstimmung je Kodier-Dimension</summary><div class="scroll-table"><table><thead><tr><th>Dimension</th><th>exakt</th><th>±1</th><th>gew. Kappa</th></tr></thead><tbody>${rl.per_dimension.map(x=>`<tr><td>${esc(x.dimension)}</td><td>${x.exact_pct}%</td><td>${x.within1_pct}%</td><td>${x.weighted_kappa===null?'—':x.weighted_kappa}</td></tr>`).join('')}</tbody></table></div></details></section>`).join('');
  research.innerHTML=reachPanel+reliabilityPanel+`<section class="panel"><h2>Medienvergleich – Kurzbefund</h2><p><b>Diese Tabelle steht am Anfang:</b> Sie zeigt Richtungssignal, Volltextbasis und codierte Kontextlücken. „Nicht behandelt / Prüfhinweis“ bedeutet, dass das Thema in den geprüften Texten nicht vorkam. Bei breit angelegten Bilanz- oder Grundsatztexten ist das eine relevante Auslassungsfrage; bei einer engen Meldung nicht. Es ist kein automatischer Beweis bewusster Täuschung.</p><div class="scroll-table"><table><thead><tr><th>Medium / Quelle</th><th>Einordnung</th><th>Volltexte</th><th>Richtung Ø</th><th>Kontextlücken</th><th>Kriminalität</th><th>Einbürgerung</th><th>Sozialsystem</th></tr></thead><tbody>${d.media_summary.map(s=>{const topics=(d.article_codings.filter(c=>c.medium===s.medium&&c.access_level.toLowerCase()==='volltext'&&!c.genre.toLowerCase().includes('agentur')).map(c=>c.topic)); const has=topic=>topics.includes(topic); return `<tr><td><b>${esc(s.medium)}</b></td><td>${esc(s.profile)}</td><td>${s.editorial_fulltexts}</td><td>${s.policy_mean===null?'—':s.policy_mean.toFixed(2)}</td><td>${s.omission_rate===null?'—':s.omission_count+' / '+Math.round(s.omission_rate*100)+' %'}${s.high_omission_count?`<br><small>hoch: ${s.high_omission_count}</small>`:''}</td><td>${has('Kriminalität und Staatsangehörigkeit')?'enthalten':'nicht behandelt / Prüfhinweis'}</td><td>${has('Einbürgerung')?'enthalten':'nicht behandelt / Prüfhinweis'}</td><td>${has('Asylbewerberleistungen')?'enthalten':'nicht behandelt / Prüfhinweis'}</td></tr>`}).join('')}</tbody></table></div><p class="tag">Orientierung: −2 migrationsliberal · 0 neutral · +2 migrationsrestriktiv</p></section>`+
  `<section class="panel" id="eigentuemer"><h2>Eigentümer, Trägerschaft und politische Agenda – mit Belegen</h2><p>Wer ein Medium besitzt oder finanziert und welche politische Agenda diese Eigentümer verfolgen, ist für die Einordnung wesentlich – deshalb wird es hier zu <b>jedem</b> Medium offengelegt und belegt. Die Quellen dokumentieren die <b>Grundlage</b> der politischen Arbeitshypothese (Trägerschaft, Rechtsrahmen, Selbstverständnis, externe Einordnung, Publikumsstudien). Sie sind kein automatischer Beweis einer Schlagseite im Einzelartikel; ein belastbarer Richtungsbefund entsteht erst aus dem geprüften Artikelkorpus. Eine parteinahe Eigentümerbeteiligung (z. B. SPD/DDVG an Madsack) wird als Transparenzhinweis ausgewiesen.</p><div class="scroll-table"><table><thead><tr><th>Medium</th><th>Einordnung (Arbeitshypothese)</th><th>Eigentümer / Trägerschaft &amp; Belege</th></tr></thead><tbody>${d.media.map(m=>{const ev=(m.evidence||[]);const owner=ev.filter(e=>/eigent|träger|herausg|finanz|agenda/i.test(e.art));const shown=owner.length?owner:ev;return `<tr><td><b>${esc(m.name)}</b></td><td>${esc(m.profile)}</td><td>${shown.length?shown.map(e=>`<div><b>${esc(e.art)}:</b> ${esc(e.beleg)} <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.quelle)} ↗</a></div>`).join(''):'<small>Noch keine Belege hinterlegt.</small>'}</td></tr>`}).join('')}</tbody></table></div><details><summary>Alle Belege je Medium (Trägerschaft, Rechtsrahmen, Selbstverständnis, externe Einordnung, Publikum)</summary>${d.media.map(m=>`<article><h3>${esc(m.name)} · <small>${esc(m.profile)}</small></h3><p><small>${esc(m.profile_note)}</small></p>${(m.evidence&&m.evidence.length)?`<ul>${m.evidence.map(e=>`<li><b>${esc(e.art)}:</b> ${esc(e.beleg)} <a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.quelle)} ↗</a></li>`).join('')}</ul>`:'<p><small>Noch keine Belege hinterlegt.</small></p>'}</article>`).join('')}</details><p class="tag">Trägerschaftsdaten: u. a. Media Ownership Monitor (Reporter ohne Grenzen) · Publikumsverortung: Reuters Institute Digital News Report</p></section>`+
  `<section class="panel"><h2>Medienweite Migrations- und Asylstichprobe</h2><p>Recherche-Snapshot vom 8. August 2026. Politische Profile sind Arbeitshypothesen über redaktionelle Schwerpunkte, keine Etiketten für jeden Artikel.</p><div class="grid"><p class="metric"><b>${d.article_codings.length}</b><br>Artikelkodierungen</p><p class="metric"><b>${d.facts.length}</b><br>externe Faktenanker</p><p class="metric"><b>${codedTopics.length}</b><br>Themenfenster</p></div></section>`+
  `<section class="panel"><h2>Ausgearbeiteter Mediencheck: Deutschlandfunk</h2><p><b>Kurzurteil:</b> Der Ceuta-Kommentar stellt Sánchez überwiegend freundlich und entlastend dar. Migrationskritische EU-Positionen werden dagegen mit Begriffen wie „Wahn“, „Migrationshysterie“, „Abschottung“ und „Marschformation“ abgewertet. Das Gerichtsurteil sowie Anreiz-, Sicherheits- und Kontrollfragen werden nicht gleichwertig behandelt.</p><p>Die vollständige Zusammenfassung trennt Sprachbelege, relevante Auslassungen, Gegenindizien und Belegstärke.</p><p><a href="/berichte/dlf-ceuta">Vollständige DLF-Ceuta-Analyse öffnen →</a></p></section>`+
  `<section class="panel"><h2>Stichproben-Reife je Medium</h2><p>Nur redaktionelle Volltexte zählen zur Schwelle. Agenturmeldungen, Metadaten, Ausschnitte und Paywall-Teile bleiben sichtbar, erfüllen sie aber nicht.</p><div class="grid">${d.sample_progress.map(p=>`<p class="metric"><b>${esc(p.medium)}</b><br>${p.editorial_fulltexts}/20 redaktionelle Volltexte · ${p.topic_count}/3 Themen<br><small>${p.mature?'Reifeschwelle erreicht':`${p.fulltext_remaining} Volltexte und ${p.topic_remaining} zusätzliche Themen bis zur Schwelle`}</small></p>`).join('')}</div></section>`+
  `<section class="panel"><h2>Vergleichstabelle: Richtung und Kontextlücken</h2><p>„Kontextlücke codiert“ bedeutet: Im Artikelraster wurde bei einem zugänglichen redaktionellen Volltext ein Auslassungsrisiko von mindestens 1/2 markiert. Das ist ein Prüfhinweis, kein Beweis für Absicht oder bewusste Manipulation. Agentur-, Paywall- und Metadatenbeiträge sind ausgeschlossen.</p><div class="scroll-table"><table><thead><tr><th>Medium</th><th>Volltexte</th><th>Themen</th><th>Orientierung Ø</th><th>Kontextlücke<br>n / Anteil</th><th>davon hoch</th><th>Status</th></tr></thead><tbody>${d.media_summary.map(s=>`<tr><td><b>${esc(s.medium)}</b><br><small>${esc(s.profile)}</small></td><td>${s.editorial_fulltexts}</td><td>${s.topic_count}</td><td>${s.policy_mean===null?'—':s.policy_mean.toFixed(2)}</td><td>${s.omission_count} / ${s.omission_rate===null?'—':Math.round(s.omission_rate*100)+' %'}</td><td>${s.high_omission_count}</td><td>${s.mature?'reif':'Pilot'}</td></tr>`).join('')}</tbody></table></div></section>`+
  `<section class="panel"><h2>Pilotstatistik: Migrationspolitische Orientierung</h2><p>Skala −2 (deutlich migrationsliberal/gegen Restriktionen) bis +2 (deutlich migrationsrestriktiv). Nur Medien mit mindestens 20 redaktionellen Volltexten aus drei Themenfenstern gelten als reif; Agenturübernahmen bleiben aus dem Medienmittel ausgeschlossen. Der Gesamtwert ist wegen unterschiedlicher Themen- und Genreanteile nur deskriptiv.</p><p><a href="/berichte/medienweite-stichprobe">Ausführlichen Forschungsstand lesen →</a> · <a href="/berichte/gov-data-abgleich">Amtlicher gov-data-Abgleich →</a> · <a href="/api/research.csv">CSV der Artikelkodierungen herunterladen →</a></p><p>${codedTopics.map(t=>`<span class="tag">${esc(t.topic)} · ${t.n}</span>`).join(' ')}</p><div class="grid">${codedMedia.map(m=>`<p class="metric"><b>${esc(m.name)}: ${m.avg.toFixed(2)}</b><br>${m.n} kodiert · ${m.editorial} redaktionell · ${m.full} redaktionelle Volltexte · ${m.topics} Themen<br>Streuung ${m.sd.toFixed(2)} · <small>${m.mature?'Schwelle erreicht':'Pilotbefund'}</small></p>`).join('')}</div><details><summary>Vergleich nach Genre</summary>${[...new Set(d.article_codings.filter(c=>!c.genre.toLowerCase().includes('agentur')).map(c=>c.genre))].sort().map(g=>{const gc=d.article_codings.filter(c=>c.genre===g&&!c.genre.toLowerCase().includes('agentur')&&c.access_level==='Volltext');return gc.length?`<h3>${esc(g)}</h3><p>${[...new Set(gc.map(c=>c.medium))].map(name=>{const mc=gc.filter(c=>c.medium===name);return `<span class="tag">${esc(name)} ${(mc.reduce((s,c)=>s+c.policy_score,0)/mc.length).toFixed(2)} · n=${mc.length}</span>`}).join(' ')}</p>`:''}).join('')}</details><details><summary>Vergleich innerhalb der Themenfenster</summary>${codedTopics.map(t=>{const tc=d.article_codings.filter(c=>c.topic===t.topic&&!c.genre.toLowerCase().includes('agentur'));return `<h3>${esc(t.topic)}</h3><p>${tc.length?[...new Set(tc.map(c=>c.medium))].map(name=>{const mc=tc.filter(c=>c.medium===name);return `<span class="tag">${esc(name)} ${(mc.reduce((s,c)=>s+c.policy_score,0)/mc.length).toFixed(2)} · n=${mc.length}</span>`}).join(' '):'Nur Agenturmaterial vorhanden.'}</p>`}).join('')}</details><details><summary>Einzelkodierungen und Begründungen</summary><label for="codingSearch">Einzelkodierungen filtern:</label> <input id="codingSearch" type="search" placeholder="Medium, Thema, Titel oder Beleg…" style="min-width:18rem"><div id="codingResults">${d.article_codings.map(c=>`<article data-coding="${esc([c.medium,c.topic,c.title,c.evidence_note].join(' ')).toLowerCase()}"><h3><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.medium)}: ${esc(c.title)}</a></h3><p><span class="tag">Politikscore ${c.policy_score}</span> <span class="tag">${esc(c.genre)}</span> <span class="tag">${esc(c.access_level)}</span> <span class="tag">${esc(c.topic)}</span></p><p>${esc(c.evidence_note)}</p></article>`).join('')}</div></details><p><a href="https://github.com/ReinerHohn/journalismus-check/blob/main/METHODE.md" target="_blank" rel="noopener">Vollständiges Kodierraster →</a></p></section>`+
  `<section class="panel"><h2>Medien und Artikel</h2>${d.media.map(m=>{const aa=d.articles.filter(a=>a.medium===m.name);return `<details><summary><b>${esc(m.name)}</b> · ${esc(m.profile)} · ${aa.length} Einträge</summary><p>${esc(m.profile_note)}</p>${aa.map(a=>`<article><h3><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></h3><p><span class="tag">${esc(a.genre)}</span> <span class="tag">${esc(a.research_status)}</span> <span class="tag">Konfidenz ${Math.round(a.confidence*100)}%</span></p><p>${esc(a.summary)}</p>${a.framing?`<p><b>Framing:</b> ${esc(a.framing)}</p>`:''}<p><b>Orientierungssignal:</b> ${esc(a.orientation_signal)}</p><small>${esc(a.source_note)}</small></article>`).join('')}</details>`}).join('')}</section>`+
  `<section class="panel"><h2>Unabhängige Faktenbasis</h2><p>Diese amtlichen und methodischen Vergleichswerte stehen außerhalb der untersuchten Artikel.</p>${d.facts.map(f=>`<article><span class="tag">${esc(f.topic)}</span><h3>${esc(f.value||'')}</h3><p>${esc(f.statement)}</p><p><b>Geltungsbereich:</b> ${esc(f.scope)}</p><p><b>Grenzen:</b> ${esc(f.limitations)}</p><p><a href="${esc(f.source_url)}" target="_blank" rel="noopener">${esc(f.source_name)}</a> · geprüft ${esc(f.checked_at)}</p></article>`).join('')}</section>`+
  `<section class="panel"><h2>Chronologie statt pauschalem Verschweigevorwurf</h2><p>Fall Hamburg-Wandsbek: Verglichen wird, was zum jeweiligen Veröffentlichungszeitpunkt belastbar verfügbar war und was der Beitrag tatsächlich nannte.</p>${d.coverage_events.sort((a,b)=>a.published_at.localeCompare(b.published_at)).map(e=>`<article><h3><a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.medium)} · ${esc(e.title)}</a></h3><p><span class="tag">${esc(e.published_at.replace('T',' '))}</span> <span class="tag">${esc(e.report_stage)}</span></p><p><b>Damals verfügbar:</b> ${esc(e.facts_available)}</p><p><b>Im Beitrag enthalten:</b> ${esc(e.facts_included)}</p><p><b>Befund:</b> ${esc(e.omission_verdict)}</p><small>${esc(e.source_basis)}</small></article>`).join('')}</section>`+
  `<section class="panel"><h2>Claim-Prüfung nach Dossier</h2>${[...new Set(d.claims.map(c=>c.topic))].map(topic=>`<details open><summary><b>${esc(topic)}</b> · ${d.claims.filter(c=>c.topic===topic).length} Claims</summary>${d.claims.filter(c=>c.topic===topic).map(c=>`<article><h3>${esc(c.claim)}</h3><p><span class="tag">${esc(c.status)}</span></p><p>${esc(c.assessment)}</p><p><b>Stützend:</b> ${c.supporting_sources.map(esc).join('; ')||'keine'}</p><p><b>Entgegenstehend/offen:</b> ${c.contradicting_sources.map(esc).join('; ')||'keine'}</p></article>`).join('')}</details>`).join('')}</section>`+
  `<section class="panel"><h2>Wann fehlt wirklich relevanter Kontext?</h2>${d.omission_examples.map(o=>`<article><h3>${esc(o.pattern)}</h3><p><span class="tag">${esc(o.verdict)}</span></p><p>${esc(o.explanation)}</p><p><b>Für einen Nachweis erforderlich:</b> ${esc(o.required_evidence)}</p></article>`).join('')}</section>`;
  const codingSearch = document.querySelector('#codingSearch');
  if (codingSearch) codingSearch.oninput = () => {
    const needle = codingSearch.value.trim().toLowerCase();
    document.querySelectorAll('[data-coding]').forEach(article => {
      article.hidden = needle !== '' && !article.dataset.coding.includes(needle);
    });
  };
}
document.querySelector('#showResearch').onclick=showResearch;
showResearch();
document.querySelector('#run').onclick = async () => {
  const button=document.querySelector('#run'), status=document.querySelector('#status'), root=document.querySelector('#result');
  button.disabled=true; status.textContent='Analyse läuft …'; root.innerHTML='';
  try {
    const response=await fetch('/api/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:document.querySelector('#text').value,deep:document.querySelector('#deep').checked})});
    const data=await response.json(); if(!response.ok) throw new Error(data.detail || 'Analyse fehlgeschlagen');
    const x=data.local;
    root.innerHTML=`<section class="panel"><h2>Lokaler Befund</h2><div class="grid"><p class="metric"><b>${x.word_count}</b><br>Wörter</p><p class="metric"><b>${x.signal_count}</b><br>sprachliche Signale</p><p class="metric"><b>${x.signal_density}</b><br>Signale je 1.000 Wörter</p></div><p>${esc(x.notice)}</p></section>`+
      `<section class="panel"><h2>Textbelege</h2>${x.findings.length ? x.findings.map(f=>`<article><span class="tag">${esc(f.category)}</span><blockquote>${esc(f.quote)}</blockquote><p><b>${esc(f.term)}:</b> ${esc(f.explanation)}</p></article>`).join('') : '<p>Keine Begriffe aus der kleinen lokalen Prüfliste gefunden.</p>'}</section>`+
      `<section class="panel"><h2>Genannte Akteure</h2><p>${Object.entries(x.actors).map(([a,n])=>`<span class="tag">${esc(a)} · ${n}</span>`).join(' ') || 'Keine zuverlässig erkannt.'}</p><h2>Prüffragen</h2><ol>${x.questions.map(q=>`<li>${esc(q)}</li>`).join('')}</ol></section>`+
      (data.deep ? `<section class="panel"><h2>KI-Tiefenanalyse</h2><pre>${esc(JSON.stringify(data.deep,null,2))}</pre></section>` : '');
    status.textContent='Fertig.';
  } catch(e) { status.innerHTML=`<span class="error">${esc(e.message)}</span>`; }
  finally { button.disabled=false; }
};
</script></body></html>
